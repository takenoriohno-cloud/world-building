<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradKanto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="outlandBoarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.35" />
    </linearGradient>
    <linearGradient id="corridorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.25" />
    </linearGradient>
    <radialGradient id="manaNexus" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="700" fill="url(#bgGradKanto)" />

  <!-- Grid / Coordinate Lines -->
  <g stroke="#1e293b" stroke-width="0.8" stroke-dasharray="4,4">
    <line x1="80" y1="40" x2="80" y2="660" />
    <line x1="240" y1="40" x2="240" y2="660" />
    <line x1="400" y1="40" x2="400" y2="660" />
    <line x1="560" y1="40" x2="560" y2="660" />
    <line x1="720" y1="40" x2="720" y2="660" />
    <line x1="880" y1="40" x2="880" y2="660" />
    <line x1="40" y1="100" x2="920" y2="100" />
    <line x1="40" y1="240" x2="920" y2="240" />
    <line x1="40" y1="380" x2="920" y2="380" />
    <line x1="40" y1="520" x2="920" y2="520" />
    <line x1="40" y1="640" x2="920" y2="640" />
  </g>

  <!-- Coordinates Labels -->
  <g fill="#64748b" font-size="10" font-family="monospace">
    <text x="75" y="680">138°40'E</text>
    <text x="235" y="680">139°00'E</text>
    <text x="395" y="680">139°20'E</text>
    <text x="555" y="680">139°40'E</text>
    <text x="715" y="680">140°00'E</text>
    <text x="875" y="680">140°20'E</text>
    <text x="15" y="104">36°00'N</text>
    <text x="15" y="244">35°45'N</text>
    <text x="15" y="384">35°30'N</text>
    <text x="15" y="524">35°15'N</text>
  </g>

  <!-- Tokyo Bay & Ocean Landmass Geometry -->
  <g id="ocean-tokyo-bay">
    <!-- Tokyo Bay Water -->
    <path d="M 650,420 Q 640,490 670,550 T 730,620 L 820,700 L 960,700 L 960,350 Q 820,380 750,400 Z" fill="#082f49" fill-opacity="0.6" stroke="#0284c7" stroke-width="1.5" />
    <!-- Sagami Bay -->
    <path d="M 380,560 Q 450,580 520,620 L 520,700 L 300,700 Z" fill="#082f49" fill-opacity="0.6" stroke="#0284c7" stroke-width="1.5" />
    <!-- Rivers: Tama River & Arakawa -->
    <path d="M 180,260 Q 320,300 480,360 T 640,420" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="6,2" />
    <text x="420" y="345" fill="#38bdf8" font-size="10" font-family="sans-serif" opacity="0.7">多摩川水系（マナ流脈）</text>
  </g>

  <!-- Kanto Mountains Topography (Chichibu, Okutama, Tanzawa) -->
  <g id="mountain-ranges" opacity="0.85">
    <!-- Chichibu North Mountains -->
    <path d="M 60,80 Q 150,60 220,110 T 320,160 L 260,220 L 120,200 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <!-- Okutama Mountain Range (Core Mana Hotspot) -->
    <path d="M 110,180 Q 200,160 280,210 T 350,290 L 260,360 L 130,320 Z" fill="#334155" stroke="#475569" stroke-width="2" />
    <!-- Tanzawa Mountain Range (South) -->
    <path d="M 140,350 Q 220,330 300,380 T 360,460 L 280,520 L 160,480 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  </g>

  <!-- Mana Hotspot Glow -->
  <circle cx="210" cy="250" r="130" fill="url(#manaNexus)" />

  <!-- Habitats & Distribution Zones -->
  <!-- Zone 1: Primary High-Density Habitat (Okutama Deep Abyss/Mine area) -->
  <polygon points="120,200 240,170 300,230 270,320 160,310 110,240" fill="url(#outlandBoarGrad)" stroke="#ef4444" stroke-width="2.5" filter="url(#glowRed)" />

  <!-- Zone 2: Foraging & Incursion Corridor (Itsukaichi Ruins & Akigawa) -->
  <polygon points="270,220 380,200 450,260 410,340 300,310" fill="url(#corridorGrad)" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3" />

  <!-- Tokyo Concentric Fortress Defense Lines -->
  <g id="tokyo-fortress-rings">
    <!-- Core Safe Zone (1st Ring: Yamanote / Imperial Palace) -->
    <circle cx="630" cy="300" r="45" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="2" />
    <!-- Inner Zone (2nd Ring: Ring 7 / Ring 8) -->
    <ellipse cx="620" cy="300" rx="95" ry="85" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6,3" />
    <!-- 3rd Ring: National Route 16 & Ken-O Expressway Fortress Wall -->
    <!-- Ken-O Expressway Defense Barrier -->
    <path d="M 460,80 Q 490,200 470,350 T 430,540" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8,4" filter="url(#glowCyan)" />
    <!-- Route 16 Wall -->
    <path d="M 530,60 Q 560,220 540,380 T 510,580" fill="none" stroke="#22c55e" stroke-width="3.5" />
  </g>

  <!-- Specific POI Markers & Labels -->
  <!-- 1. Primary Habitat Core -->
  <circle cx="190" cy="235" r="8" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
  <text x="190" y="215" fill="#fca5a5" font-size="13" font-family="sans-serif" font-weight="bold" text-anchor="middle">【一次野生生息地】雲取山・日原鍾乳洞</text>
  <text x="190" y="262" fill="#fecaca" font-size="11" font-family="sans-serif" text-anchor="middle">（石英露頭・高濃度ケイ素泥ヌタ場）</text>

  <!-- 2. Foraging Corridor -->
  <circle cx="360" cy="270" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" />
  <text x="360" y="250" fill="#fde68a" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">【採餌・移動回廊】五日市街道廃墟群</text>
  <text x="360" y="295" fill="#fef3c7" font-size="10.5" font-family="sans-serif" text-anchor="middle">（秋川渓谷・母系群れ出没多発帯）</text>

  <!-- 3. Akiruno Checkpoint -->
  <circle cx="470" cy="290" r="8" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
  <text x="470" y="320" fill="#38bdf8" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">あきる野前線検問ゲート</text>
  <text x="470" y="338" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">（圏央道要塞線 / 12.7mm重機関銃座）</text>

  <!-- 4. Hachioji Forward Fortress -->
  <circle cx="525" cy="350" r="9" fill="#16a34a" stroke="#4ade80" stroke-width="2" />
  <text x="545" y="345" fill="#4ade80" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="start">八王子前線要塞基地</text>
  <text x="545" y="365" fill="#86efac" font-size="10" font-family="sans-serif" text-anchor="start">（第3同心円 / 認可魔獣解体施設）</text>

  <!-- 5. Tokyo Core -->
  <circle cx="630" cy="300" r="6" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
  <text x="630" y="290" fill="#6ee7b7" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">東京コア・セーフゾーン</text>
  <text x="630" y="330" fill="#a7f3d0" font-size="10" font-family="sans-serif" text-anchor="middle">（皇居・第1同心円大結界）</text>

  <!-- Title Box (Top Left) -->
  <rect x="30" y="25" width="380" height="65" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.5" />
  <text x="45" y="50" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="bold">オクタマイワシシ 生息・分布境界図</text>
  <text x="45" y="72" fill="#94a3b8" font-size="11" font-family="sans-serif">Sus scrofa petramorphus Distribution Map (Kanto Defense Sector)</text>

  <!-- Legend Box (Bottom Left) -->
  <rect x="30" y="540" width="360" height="125" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.5" />
  <text x="45" y="562" fill="#f1f5f9" font-size="12" font-family="sans-serif" font-weight="bold">【凡例・防衛境界区分】</text>
  
  <rect x="45" y="575" width="18" height="12" fill="#ef4444" fill-opacity="0.8" stroke="#ef4444" stroke-width="1" />
  <text x="72" y="586" fill="#e2e8f0" font-size="11" font-family="sans-serif">一次野生生息地（高濃度地霊マナ・成体雄単独域）</text>

  <rect x="45" y="598" width="18" height="12" fill="#f59e0b" fill-opacity="0.6" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,2" />
  <text x="72" y="609" fill="#e2e8f0" font-size="11" font-family="sans-serif">二次採餌・移動回廊（母系群れ出没・突進被害多発）</text>

  <line x1="45" y1="628" x2="65" y2="628" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,3" />
  <text x="72" y="632" fill="#e2e8f0" font-size="11" font-family="sans-serif">圏央道・迎撃防護フェンス線（あきる野ゲート）</text>

  <line x1="45" y1="648" x2="65" y2="648" stroke="#22c55e" stroke-width="3.5" />
  <text x="72" y="652" fill="#e2e8f0" font-size="11" font-family="sans-serif">国道16号・第3同心円要塞線（八王子解体前線）</text>
</svg>
