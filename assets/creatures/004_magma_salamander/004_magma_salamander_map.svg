<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120c08"/>
      <stop offset="50%" stop-color="#1c110a"/>
      <stop offset="100%" stop-color="#0a0502"/>
    </linearGradient>
    <linearGradient id="primaryZone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b00" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff8500" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="colonyZone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="480" fill="url(#bgGrad)" rx="12"/>
  <rect x="10" y="10" width="880" height="460" fill="none" stroke="#4a2612" stroke-width="1.5" stroke-dasharray="4 4" rx="8"/>

  <!-- Title Header -->
  <text x="35" y="45" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="bold" fill="#ff7733" letter-spacing="1.5">ヨウガンヒトカゲ（溶岩火蜥蜴） 生息・分布マップ</text>
  <text x="35" y="68" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#a88c7d">GLOBAL HABITAT &amp; VOLCANIC COLONY DISTRIBUTION MAP / REF: GEO-SLM-004</text>

  <!-- World Map Stylized Outline -->
  <g fill="#241913" stroke="#3d271a" stroke-width="1" opacity="0.9">
    <!-- Europe & Mediterranean -->
    <path d="M 160 120 L 220 110 L 280 130 L 290 180 L 260 220 L 220 230 L 190 200 L 170 160 Z"/>
    <!-- Africa -->
    <path d="M 180 240 L 270 240 L 310 320 L 270 420 L 200 390 L 170 290 Z"/>
    <!-- Eurasia -->
    <path d="M 290 120 L 480 100 L 620 120 L 680 180 L 590 260 L 450 240 L 320 200 Z"/>
    <!-- Japan Archipelago -->
    <path d="M 720 170 Q 740 190 730 220 L 710 240 L 705 230 Q 715 200 710 180 Z"/>
    <!-- Iceland -->
    <ellipse cx="140" cy="90" rx="20" ry="12"/>
  </g>

  <!-- Region 1: Mediterranean Primary Habitat (Etna & Vesuvius) -->
  <g filter="url(#glow)">
    <circle cx="235" cy="210" r="32" fill="url(#primaryZone)"/>
    <circle cx="235" cy="210" r="42" fill="none" stroke="#ff4400" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="140" cy="90" r="18" fill="url(#primaryZone)" opacity="0.7"/>
  </g>
  
  <!-- Mediterranean Annotation Pin -->
  <line x1="235" y1="210" x2="290" y2="280" stroke="#ff8500" stroke-width="1.5"/>
  <rect x="290" y="260" width="230" height="74" fill="#140a05" stroke="#ff6600" stroke-width="1.2" rx="5"/>
  <text x="300" y="280" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ff9944">【一次野生生息地】南欧地中海火山帯</text>
  <text x="300" y="298" font-family="Arial, sans-serif" font-size="11" fill="#d9c2b0">• シチリア島エトナ山（古生主級 Elder Alpha 生息）</text>
  <text x="300" y="314" font-family="Arial, sans-serif" font-size="11" fill="#d9c2b0">• カンパーニア州ヴェスヴィオ / アイスランド地熱帯</text>
  <text x="300" y="328" font-family="Arial, sans-serif" font-size="10" fill="#ff5500">※環境: 溶岩湖 900〜1,200℃ / 高濃度火霊マナ</text>

  <!-- Region 2: Japan Established Colony (Aso & Sakurajima) -->
  <g filter="url(#glow)">
    <circle cx="712" cy="225" r="22" fill="url(#colonyZone)"/>
    <circle cx="712" cy="225" r="30" fill="none" stroke="#ff0055" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- Japan Annotation Pin -->
  <line x1="712" y1="225" x2="620" y2="310" stroke="#ff0055" stroke-width="1.5"/>
  <rect x="520" y="310" width="240" height="74" fill="#140a05" stroke="#ff0055" stroke-width="1.2" rx="5"/>
  <text x="530" y="330" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ff5588">【国内定着コロニー】阿蘇・桜島火山帯</text>
  <text x="530" y="348" font-family="Arial, sans-serif" font-size="11" fill="#d9c2b0">• 阿蘇中岳第1火口原〜地熱発電所周辺</text>
  <text x="530" y="364" font-family="Arial, sans-serif" font-size="11" fill="#d9c2b0">• 桜島昭和火口 / 富士・箱根研究プラント</text>
  <text x="530" y="378" font-family="Arial, sans-serif" font-size="10" fill="#ff5588">※警戒区分: 特定外来危険魔獣 / 駆除PMC配備</text>

  <!-- Smuggling & Dispersal Oceanic Route -->
  <path d="M 245 220 Q 450 350 700 230" fill="none" stroke="#ff8800" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  <text x="430" y="320" font-family="Arial, sans-serif" font-size="10" fill="#ffaa33" transform="rotate(-6 430 320)">マナ海流分散 ＆ メガコーポ密輸回廊</text>

  <!-- Legend Panel -->
  <rect x="35" y="380" width="300" height="75" fill="#120803" stroke="#4a2612" stroke-width="1" rx="4"/>
  <circle cx="55" cy="400" r="7" fill="#ff4400"/>
  <text x="70" y="404" font-family="Arial, sans-serif" font-size="11" fill="#e6cfc2">一次野生生息地（地中海・アイスランド原典地）</text>
  <circle cx="55" cy="422" r="7" fill="#ff0055"/>
  <text x="70" y="426" font-family="Arial, sans-serif" font-size="11" fill="#e6cfc2">定着繁殖コロニー・研究施設（日本国内）</text>
  <line x1="48" y1="442" x2="64" y2="442" stroke="#ff8800" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="70" y="445" font-family="Arial, sans-serif" font-size="11" fill="#e6cfc2">マナ海流分散 / 密輸ルート</text>
</svg>
