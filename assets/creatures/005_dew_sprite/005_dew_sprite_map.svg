<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e14"/>
      <stop offset="100%" stop-color="#0e1722"/>
    </linearGradient>

    <!-- Mana Water Glow -->
    <radialGradient id="waterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#00c896" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00c896" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="tacGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1f2d3d" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  <rect width="1600" height="900" fill="url(#tacGrid)"/>

  <!-- Header HUD -->
  <rect x="50" y="35" width="1500" height="65" fill="#0d1520" stroke="#00c896" stroke-width="1.5" rx="4"/>
  <text x="80" y="68" font-family="'Arial', sans-serif" font-weight="bold" font-size="22" fill="#ffffff" letter-spacing="2">
    HABITAT &amp; ECOLOGICAL PROTECTION MAP : 005 DEW SPRITE (アサツユセイレイ)
  </text>
  <text x="80" y="88" font-family="'Arial', sans-serif" font-size="12" fill="#00c896" letter-spacing="1">
    [CLASS-A NON-HARVESTABLE PROTECTED FAUNA] // PRIMARY HABITAT: SCHWARZWALD (GERMANY) &amp; AOKIGAHARA (JAPAN)
  </text>
  <text x="1150" y="70" font-family="'Arial', sans-serif" font-size="11" fill="#8ba0b5">
    DATA: IUCN PROTECTED AREA CATEGORY Ia / SACRED FOREST SANCTUARY
  </text>
  <text x="1150" y="88" font-family="'Arial', sans-serif" font-size="11" fill="#00ffff">
    MANA RESONANCE: WATER/FAYE DUAL FREQUENCY (490-530nm)
  </text>

  <!-- Panel 1: Schwarzwald (Germany) -->
  <g transform="translate(60, 130)">
    <!-- Panel Box -->
    <rect width="720" height="710" fill="#0a121a" stroke="#00c896" stroke-width="1.5" rx="6"/>
    <rect x="20" y="20" width="680" height="36" fill="#101d2a" rx="3"/>
    <text x="35" y="44" font-family="'Arial', sans-serif" font-weight="bold" font-size="14" fill="#00c896">
      PANEL A: PRIMARY SANCTUARY - SCHWARZWALD (BADEN-WÜRTTEMBERG, GERMANY)
    </text>
    <text x="510" y="43" font-family="'Arial', sans-serif" font-size="10" fill="#7a92a5">
      LAT 48°18'N, LON 8°12'E // ELEV 800-1,200m
    </text>

    <!-- Topographic Contours (Schwarzwald Valleys) -->
    <path d="M 50 620 Q 200 450 350 480 T 670 420" fill="none" stroke="#1a382d" stroke-width="1.5" stroke-dasharray="4,4"/>
    <path d="M 50 540 Q 180 380 360 410 T 670 340" fill="none" stroke="#1e4d3c" stroke-width="2"/>
    <path d="M 50 460 Q 220 310 380 340 T 670 260" fill="none" stroke="#1a382d" stroke-width="1.5" stroke-dasharray="4,4"/>
    <path d="M 50 380 Q 240 230 400 270 T 670 180" fill="none" stroke="#256d53" stroke-width="2.5"/>

    <!-- River / Valley: Kirchzarten Brook -->
    <path d="M 280 650 Q 320 480 360 380 T 460 120" fill="none" stroke="#00b4d8" stroke-width="3" opacity="0.8"/>
    <text x="470" y="140" font-family="'Arial', sans-serif" font-size="11" fill="#00b4d8">Kirchzarten Stream (Mist Corridor)</text>

    <!-- Sprite Dense Colonies (Halo) -->
    <circle cx="360" cy="380" r="140" fill="url(#waterGlow)"/>
    <circle cx="360" cy="380" r="80" fill="#00ffff" fill-opacity="0.15" stroke="#00ffff" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#neonGlow)"/>
    
    <!-- Habitat Sector Pins -->
    <circle cx="360" cy="380" r="6" fill="#00ffff"/>
    <circle cx="360" cy="380" r="12" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <text x="380" y="375" font-family="'Arial', sans-serif" font-weight="bold" font-size="13" fill="#ffffff">
      Sector-A: Ancient Fir &amp; Fern Core
    </text>
    <text x="380" y="395" font-family="'Arial', sans-serif" font-size="11" fill="#00c896">
      • Nighttime Dew Aggregation / High Density Colony (400-600 ind.)
    </text>
    <text x="380" y="413" font-family="'Arial', sans-serif" font-size="11" fill="#8ba0b5">
      • Flora: Dryopteris filix-mas &amp; Hypnum moss / 100% Humidity
    </text>

    <!-- Druidic Sanctuary Buffer -->
    <rect x="80" y="480" width="280" height="85" fill="#0b1822" stroke="#00c896" stroke-width="1" rx="4"/>
    <text x="95" y="505" font-family="'Arial', sans-serif" font-weight="bold" font-size="12" fill="#00c896">Sector-B: Druid Outer Buffer</text>
    <text x="95" y="525" font-family="'Arial', sans-serif" font-size="10" fill="#cfdbe5">• Authorized Dewdrop Nectar Harvesting</text>
    <text x="95" y="542" font-family="'Arial', sans-serif" font-size="10" fill="#8ba0b5">• Strict Ban on Combustion Engines / Noise</text>

    <!-- Saeder-Stiftung Checkpoint -->
    <circle cx="580" cy="580" r="5" fill="#ffd166"/>
    <text x="440" y="615" font-family="'Arial', sans-serif" font-weight="bold" font-size="11" fill="#ffd166">Baden-Baden Perimeter Gate</text>
    <text x="440" y="632" font-family="'Arial', sans-serif" font-size="10" fill="#8ba0b5">Saeder-Stiftung Mana Checkpoint</text>
  </g>

  <!-- Panel 2: Aokigahara Forest (Japan) -->
  <g transform="translate(820, 130)">
    <rect width="720" height="710" fill="#0a121a" stroke="#00c896" stroke-width="1.5" rx="6"/>
    <rect x="20" y="20" width="680" height="36" fill="#101d2a" rx="3"/>
    <text x="35" y="44" font-family="'Arial', sans-serif" font-weight="bold" font-size="14" fill="#00ffff">
      PANEL B: DOMESTIC SANCTUARY - AOKIGAHARA &amp; YAKUSHIMA (JAPAN)
    </text>
    <text x="480" y="43" font-family="'Arial', sans-serif" font-size="10" fill="#7a92a5">
      LAT 35°28'N, LON 138°37'E // MT. FUJI PRIMAL MOSS ZONE
    </text>

    <!-- Topographic Contours (Fuji Lava Plateau) -->
    <ellipse cx="360" cy="380" rx="300" ry="240" fill="none" stroke="#16382d" stroke-width="2"/>
    <ellipse cx="360" cy="380" rx="200" ry="160" fill="none" stroke="#1f543e" stroke-width="2" stroke-dasharray="6,4"/>
    <ellipse cx="360" cy="380" rx="110" ry="90" fill="none" stroke="#2a7254" stroke-width="2.5"/>

    <!-- Aokigahara Deep Moss Sanctuary Glow -->
    <circle cx="360" cy="380" r="130" fill="url(#waterGlow)"/>
    <circle cx="360" cy="380" r="70" fill="#00c896" fill-opacity="0.15" stroke="#00c896" stroke-width="1.5" filter="url(#neonGlow)"/>

    <!-- Deep Cave / Primal Moss Basin -->
    <circle cx="360" cy="380" r="6" fill="#00ffff"/>
    <circle cx="360" cy="380" r="12" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <text x="385" y="375" font-family="'Arial', sans-serif" font-weight="bold" font-size="13" fill="#ffffff">
      Aokigahara Primal Moss Lava Tube Zone
    </text>
    <text x="385" y="395" font-family="'Arial', sans-serif" font-size="11" fill="#00ffff">
      • Deep Lava Plateau / Constant 0-3°C Subterranean Humid Air
    </text>
    <text x="385" y="413" font-family="'Arial', sans-serif" font-size="11" fill="#8ba0b5">
      • Established 2004 / Ministry of Environment Strict Sanctuary
    </text>

    <!-- Secondary Habitat: Yakushima -->
    <rect x="60" y="550" width="310" height="90" fill="#0b1822" stroke="#00ffff" stroke-width="1" rx="4"/>
    <text x="75" y="575" font-family="'Arial', sans-serif" font-weight="bold" font-size="12" fill="#00ffff">
      Secondary Colony: Yakushima (Shiratani)
    </text>
    <text x="75" y="595" font-family="'Arial', sans-serif" font-size="10" fill="#cfdbe5">
      • Primal Cryptomeria (Yaku Sugi) Moss Ravine
    </text>
    <text x="75" y="612" font-family="'Arial', sans-serif" font-size="10" fill="#8ba0b5">
      • Annual Rainfall 8,000mm / Ideal Pure Mana Condensation
    </text>

    <!-- Shinto Shrine / Teikoku Pharma Research Station -->
    <circle cx="580" cy="220" r="5" fill="#ff70a6"/>
    <text x="440" y="215" font-family="'Arial', sans-serif" font-weight="bold" font-size="11" fill="#ff70a6">
      Fuji Sengen Barrier Shrine
    </text>
    <text x="440" y="232" font-family="'Arial', sans-serif" font-size="10" fill="#8ba0b5">
      Teikoku Pharma Bio-Observation Post
    </text>
  </g>
</svg>
